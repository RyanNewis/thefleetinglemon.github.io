
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gigs | The Fleeting Lemon</title>

  <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">

  <style>
    .gig-intro {
      padding: 75px 6% 45px;
    }

    .gig-intro h1 {
      font-size: clamp(65px, 10vw, 135px);
      margin: 20px 0 30px;
    }

    .gig-intro p {
      font-family: var(--font-typewriter);
      color: var(--muted);
      line-height: 1.7;
      max-width: 650px;
    }

    .gig-collection {
      padding: 20px 6% 120px;
      min-height: 35vh;
    }

    .gig-placeholder {
      border-top: 1px solid var(--line);
      padding-top: 35px;
      max-width: 650px;
    }

    .gig-placeholder h2 {
      font-family: var(--font-typewriter);
      font-size: 18px;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 0 0 20px;
    }

    .gig-placeholder p {
      font-family: var(--font-typewriter);
      font-size: 15px;
      line-height: 1.8;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="/" class="logo">The Fleeting Lemon</a>

    <nav>
      <a href="/albums/">Albums</a>
      <a href="/gigs/">Gigs</a>
      <a href="/musings/">Musings</a>
    </nav>
  </header>

  <main>

    <section class="gig-intro">
      <h1>Gigs</h1>

      <p>
        Live music, loud rooms, strong smells, blurry photographs
        ...times worth remembering.
      </p>
    </section>

    <section class="gig-collection" aria-label="Gig reviews">

      <div class="gig-placeholder">
        <h2>More to come</h2>

        <p>
          A growing collection of live music experiences,
          memorable performances and nights worth writing about.
        </p>
      </div>

    </section>

  </main>

  <footer>
    <span>THE FLEETING LEMON</span>
    <span>A personal music archive.</span>
  </footer>

</body>
</html>

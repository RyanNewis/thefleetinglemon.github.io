
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{ page.title }} — {{ page.artist }} | The Fleeting Lemon</title>

  <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">

  <style>
    /* Album review page */

    .review-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 65px 6% 100px;
    }

    .back-link {
      display: inline-block;
      font-family: var(--font-typewriter);
      font-size: 13px;
      color: var(--red);
      margin-bottom: 50px;
    }

    .review-header {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 55px;
      align-items: center;
      margin-bottom: 70px;
    }

    .review-cover {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .review-header h1 {
      font-size: clamp(45px, 6vw, 90px);
      overflow-wrap: anywhere;
      margin: 20px 0 30px;
    }

    .review-meta {
      font-family: var(--font-typewriter);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .review-content {
      max-width: 750px;
      margin: 0 auto;
      font-size: 17px;
      line-height: 1.85;
    }

    .review-content h2,
    .review-content h3 {
      font-family: var(--font-typewriter);
      color: var(--paper);
      line-height: 1.4;
      margin-top: 45px;
    }

    .review-content p,
    .review-content li {
      color: #d1cbc4;
    }

    .review-content a {
      color: var(--red);
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      .review-header {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .review-header h1 {
        font-size: clamp(45px, 11vw, 75px);
      }

      .review-page {
        padding-top: 40px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="/" class="logo">The Fleeting Lemon</a>

    <nav>
      <a href="/albums/">Albums</a>
      <a href="/gigs/">Gigs</a>
      <a href="/musings/">Musings</a>
    </nav>
  </header>

  <main class="review-page">

    <a href="/albums/" class="back-link">← Back to Albums</a>

    <section class="review-header">

      <img
        class="review-cover"
        src="{{ page.cover }}"
        alt="{{ page.title | escape }} album cover by {{ page.artist | escape }}">

      <div>
        <span class="eyebrow">Album Review</span>

        <h1>{{ page.title }}</h1>

        <p class="review-meta">
          {{ page.artist }}<br>
          {{ page.year }}<br>
          {{ page.genre }}
        </p>
      </div>

    </section>

    <article class="review-content">
      {{ content }}
    </article>

  </main>

  <footer>
    <span>THE FLEETING LEMON</span>
    <span>A personal music archive.</span>
  </footer>

</body>
</html>
